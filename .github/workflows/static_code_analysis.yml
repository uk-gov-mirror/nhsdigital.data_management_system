---
name: Static Code Analysis

on: [pull_request]

jobs:
  brakeman:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # actions/checkout@v6 see https://github.com/actions/checkout/releases/tag/v6
      - name: Set up Ruby + Bundle
        uses: ruby/setup-ruby@6aaa311d81eba98ae12eaffbcb63296ace0efcde # ruby/setup-ruby@v1 see https://github.com/ruby/setup-ruby/tree/v1
        with:
          bundler-cache: true
      - name: Run Brakeman analysis
        run: bundle exec brakeman --parser-timeout 60

  bundle-audit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # actions/checkout@v6 see https://github.com/actions/checkout/releases/tag/v6
      - name: Set up Ruby + Bundle
        uses: ruby/setup-ruby@6aaa311d81eba98ae12eaffbcb63296ace0efcde # ruby/setup-ruby@v1 see https://github.com/ruby/setup-ruby/tree/v1
        with:
          bundler-cache: true
      - name: Audit the bundle
        # Ignore bootstrap version 3 warning: https://nhsd-jira.digital.nhs.uk/browse/NDRS2-1676
        run: bundle exec bundle-audit check --update --ignore CVE-2024-6484
        # run: bundle exec bundle-audit check --update

  yarn-audit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # actions/checkout@v6 see https://github.com/actions/checkout/releases/tag/v6
      - name: Set up Ruby + Bundle
        uses: ruby/setup-ruby@6aaa311d81eba98ae12eaffbcb63296ace0efcde # ruby/setup-ruby@v1 see https://github.com/ruby/setup-ruby/tree/v1
        with:
          bundler-cache: true
      - name: Audit the yarn npm packages
        run: script/yarn_audit.sh

